name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Partition checker tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run tests
        run: bash tests/run_tests.sh
